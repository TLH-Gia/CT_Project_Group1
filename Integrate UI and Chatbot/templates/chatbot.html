{% extends "base.html" %}

{% block title %}Chatbot Gợi ý{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row">

        <!-- CỘT TRÁI: Hiển thị món ăn -->
        <div class="col-md-6">
            <h2>Gợi ý món ăn</h2>
            <div class="carousel">
                <div class="food-track" id="food-track"></div>
            </div>
        </div>

        <!-- CỘT PHẢI: Chatbot -->
        <div class="col-md-6">
            <h2>Chatbot</h2>
            <div class="chatbot-container">
                <div class="chat-window" id="chat-window">
                    <div class="message bot-message d-flex align-items-start">
                        <img src="{{ url_for('static', filename='images/jane.jpg') }}" 
                            class="bot-avatar" alt="Bot Avatar">
                        <p>Xin chào! Tôi có thể giúp gì cho bạn hôm nay?</p>
                    </div>
                </div>

                <div class="chat-input-area d-flex align-items-center gap-2">
                    <input type="text" id="userInput" class="form-control" placeholder="Nhập câu hỏi...">
                    <button id="sendMessageBtn" class="send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
