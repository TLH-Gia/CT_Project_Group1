{% extends "base.html" %}

{% block title %}Chatbot Gợi ý{% endblock %}

{% block content %}
<div class="text-center my-5">
    <h1>AI Chatbot Gợi ý Món ăn</h1>
    <p class="lead">Hãy hỏi tôi để tìm món ăn bạn yêu thích!</p>
</div>

<div class="chatbot-container mx-auto">
    <div class="chat-window" id="chat-window">
        <!-- Chat messages will be appended here -->
        <div class="message bot-message">
            <p>Xin chào! Tôi có thể giúp gì cho bạn trong việc tìm kiếm món ăn hôm nay?</p>
        </div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" class="form-control" placeholder="Nhập câu hỏi của bạn...">
        <button class="btn btn-primary" id="sendMessageBtn">Gửi</button>
    </div>
</div>
{% endblock %}
